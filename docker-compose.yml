services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./wa-session:/app/wa-session
      - ./temp:/app/temp
      - ./output:/app/output
      - ./backups:/app/backups
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"
